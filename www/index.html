<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mass Brawl — Prototipo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rubik:wght@400;500;700&display=swap');

  :root{
    --blue: #33c1ff;
    --blue-dark: #0a3d5c;
    --orange: #ff8a2b;
    --orange-dark: #5c2e0a;
    --bg: #050a14;
    --panel: #0b1220;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg);
    font-family: 'Rubik', sans-serif; color:#eaf2ff;
    overflow:hidden; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    position:relative; width:480px; max-width:100vw; height:100vh; max-height:900px;
    background:
      radial-gradient(circle at 20% 0%, rgba(51,193,255,0.08), transparent 45%),
      radial-gradient(circle at 80% 0%, rgba(255,138,43,0.08), transparent 45%),
      var(--bg);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #hud{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 8px;
  }
  .score{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:28px;
    min-width:64px; text-align:center; padding:6px 14px; border-radius:14px;
    background:var(--panel);
  }
  .score.blue{ color:var(--blue); border:2px solid var(--blue); box-shadow:0 0 14px rgba(51,193,255,0.35) inset; }
  .score.orange{ color:var(--orange); border:2px solid var(--orange); box-shadow:0 0 14px rgba(255,138,43,0.35) inset; }
  #timer{
    font-family:'Orbitron', sans-serif; font-weight:600; font-size:18px; letter-spacing:1px;
    color:#cfe3ff; background:var(--panel); padding:6px 12px; border-radius:10px;
  }
  #turnIndicator{
    text-align:center; font-size:13px; letter-spacing:0.3px; color:#9fb3d1; padding:2px 0 6px;
    min-height:18px;
  }
  #canvasWrap{ position:relative; flex:1; margin:0 10px 12px; border-radius:18px; overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  #overlay{
    position:absolute; inset:0; background:rgba(3,6,12,0.86);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    text-align:center; padding:20px; z-index:5;
  }
  #overlay.hidden{ display:none; }
  #overlayTitle{ font-family:'Orbitron', sans-serif; font-size:30px; margin:0; }
  #overlaySub{ color:#9fb3d1; margin:0; font-size:14px; max-width:280px; }
  button{
    font-family:'Rubik', sans-serif; font-weight:700; font-size:15px;
    padding:12px 26px; border-radius:24px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--blue), var(--orange)); color:#04101c;
  }
  #howto{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:var(--panel); color:#cfe3ff; display:flex; align-items:center; justify-content:center;
    font-size:14px; cursor:pointer; z-index:6; border:1px solid rgba(255,255,255,0.15);
  }
  #menuOverlay{
    position:absolute; inset:0; background:
      radial-gradient(circle at 25% 20%, rgba(51,193,255,0.16), transparent 50%),
      radial-gradient(circle at 75% 80%, rgba(255,138,43,0.16), transparent 50%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:26px;
    text-align:center; padding:30px; z-index:10;
  }
  #menuOverlay.hidden{ display:none; }
  #menuTitle{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:38px; margin:0;
    letter-spacing:1px;
  }
  #menuTitle span{ color:var(--orange); }
  #menuSub{ color:#9fb3d1; margin:-14px 0 6px; font-size:14px; max-width:280px; }
  .modeBtn{
    width:240px; padding:16px 20px; border-radius:16px; border:2px solid rgba(255,255,255,0.12);
    background:var(--panel); color:#eaf2ff; font-family:'Rubik',sans-serif; cursor:pointer;
    display:flex; flex-direction:column; gap:4px; align-items:center;
  }
  .modeBtn strong{ font-size:16px; }
  .modeBtn small{ color:#9fb3d1; font-weight:400; }
  .modeBtn.blueMode{ border-color:var(--blue); }
  .modeBtn.orangeMode{ border-color:var(--orange); }
  .modeBtn:active{ transform:scale(0.97); }
  #backToMenuBtn{
    margin-top:4px; background:transparent; color:#9fb3d1; text-decoration:underline;
    font-weight:500; padding:6px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="howto" title="Cómo jugar">?</div>
  <div id="hud">
    <div id="scoreLeft" class="score blue">0</div>
    <div id="timer">01:30</div>
    <div id="scoreRight" class="score orange">0</div>
  </div>
  <div id="turnIndicator">Tu turno — arrastra un orbe azul</div>
  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="menuOverlay">
      <h1 id="menuTitle">MASS <span>BRAWL</span></h1>
      <p id="menuSub">Elige contra quién quieres jugar</p>
      <button class="modeBtn blueMode" id="modeAiBtn">
        <strong>Jugar contra la IA</strong>
        <small>Tú (azul) vs. la máquina (naranja)</small>
      </button>
      <button class="modeBtn orangeMode" id="modePvpBtn">
        <strong>Jugar contra otra persona</strong>
        <small>Mismo dispositivo, turnos alternos</small>
      </button>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="overlayTitle">¡Victoria!</h1>
      <p id="overlaySub"></p>
      <button id="restartBtn">Jugar de nuevo</button>
      <button id="backToMenuBtn">Volver al menú</button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const scoreLeftEl = document.getElementById('scoreLeft');
  const scoreRightEl = document.getElementById('scoreRight');
  const timerEl = document.getElementById('timer');
  const turnEl = document.getElementById('turnIndicator');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const restartBtn = document.getElementById('restartBtn');
  const backToMenuBtn = document.getElementById('backToMenuBtn');
  const howto = document.getElementById('howto');
  const menuOverlay = document.getElementById('menuOverlay');
  const modeAiBtn = document.getElementById('modeAiBtn');
  const modePvpBtn = document.getElementById('modePvpBtn');

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  const FRICTION = 0.985;
  const MIN_SPEED = 0.04;
  const WALL_BOUNCE = 0.65;
  const MAX_DRAG = 140;
  const POWER = 0.11;
  const MATCH_TIME = 90;

  let orbs = [];
  let dragOrb = null, dragStart = null, dragCurrent = null;
  let turn = 'player'; // 'player' | 'ai'  (in pvp mode, 'ai' just means "player 2 / orange")
  let busy = false; // orbs moving, no input allowed
  let timeLeft = MATCH_TIME;
  let lastTs = null;
  let gameOver = false;
  let started = false;
  let mode = 'ai'; // 'ai' | 'pvp'
  let aiTimer = null;

  function centerX(){ return W/2; }

  function makeTeam(team, values){
    const n = values.length;
    const xBase = team === 'player' ? W*0.28 : W*0.72;
    return values.map((v, i) => {
      const r = 14 + v*1.6;
      return {
        id: team + i,
        team, value: v, r,
        x: xBase + (Math.random()-0.5)*W*0.12,
        y: H*0.18 + (H*0.62)*(i/(n-1)) + (Math.random()-0.5)*18,
        vx: 0, vy: 0
      };
    });
  }

  function turnLabel(){
    if (turn === 'player') {
      return mode === 'pvp'
        ? 'Jugador 1 (azul) — arrastra un orbe y suelta'
        : 'Tu turno — arrastra un orbe azul hacia atrás y suelta';
    }
    return mode === 'pvp'
      ? 'Jugador 2 (naranja) — arrastra un orbe y suelta'
      : 'Turno rival…';
  }

  function newGame(){
    resize();
    orbs = [
      ...makeTeam('player', [1,2,3,2,3]),
      ...makeTeam('ai', [5,2,1,2,7])
    ];
    turn = 'player';
    busy = false;
    timeLeft = MATCH_TIME;
    gameOver = false;
    started = true;
    clearTimeout(aiTimer); aiTimer = null;
    overlay.classList.add('hidden');
    menuOverlay.classList.add('hidden');
    turnEl.textContent = turnLabel();
    lastTs = null;
    requestAnimationFrame(loop);
  }

  function backToMenu(){
    clearTimeout(aiTimer); aiTimer = null;
    started = false;
    gameOver = false;
    overlay.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
  }

  function orbAt(px, py){
    for(let i=orbs.length-1;i>=0;i--){
      const o = orbs[i];
      const dx = px-o.x, dy = py-o.y;
      if (Math.hypot(dx,dy) <= o.r+6) return o;
    }
    return null;
  }

  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX-rect.left, y: t.clientY-rect.top };
  }

  function onDown(e){
    if (busy || gameOver || !started) return;
    const p = pointerPos(e);
    const o = orbAt(p.x, p.y);
    if (o && o.team === turn && isStationary(o)) {
      dragOrb = o; dragStart = p; dragCurrent = p;
      e.preventDefault();
    }
  }
  function onMove(e){
    if (!dragOrb) return;
    dragCurrent = pointerPos(e);
    e.preventDefault();
  }
  function onUp(e){
    if (!dragOrb) return;
    const p = dragCurrent || dragStart;
    let dx = dragOrb.x - p.x, dy = dragOrb.y - p.y; // pull-back direction = launch direction
    let dist = Math.hypot(dx,dy);
    dist = Math.min(dist, MAX_DRAG);
    if (dist > 8) {
      const dirx = dx/Math.hypot(dx,dy || 1e-6), diry = dy/Math.hypot(dx,dy || 1e-6);
      dragOrb.vx = dirx * dist * POWER * 6;
      dragOrb.vy = diry * dist * POWER * 6;
      busy = true;
      turnEl.textContent = turn === 'player' ? 'Orbe en juego…' : 'La IA está jugando…';
    }
    dragOrb = null; dragStart = null; dragCurrent = null;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);

  function isStationary(o){
    return Math.hypot(o.vx,o.vy) < MIN_SPEED;
  }
  function allStationary(){
    return orbs.every(isStationary);
  }

  function physicsStep(){
    for (const o of orbs){
      o.x += o.vx; o.y += o.vy;
      o.vx *= FRICTION; o.vy *= FRICTION;
      if (Math.hypot(o.vx,o.vy) < MIN_SPEED) { o.vx = 0; o.vy = 0; }

      if (o.x - o.r < 0) { o.x = o.r; o.vx = Math.abs(o.vx)*WALL_BOUNCE; }
      if (o.x + o.r > W) { o.x = W-o.r; o.vx = -Math.abs(o.vx)*WALL_BOUNCE; }
      if (o.y - o.r < 0) { o.y = o.r; o.vy = Math.abs(o.vy)*WALL_BOUNCE; }
      if (o.y + o.r > H) { o.y = H-o.r; o.vy = -Math.abs(o.vy)*WALL_BOUNCE; }
    }
    // collisions
    for (let i=0;i<orbs.length;i++){
      for (let j=i+1;j<orbs.length;j++){
        const a = orbs[i], b = orbs[j];
        const dx = b.x-a.x, dy = b.y-a.y;
        const dist = Math.hypot(dx,dy) || 0.0001;
        const minDist = a.r+b.r;
        if (dist < minDist){
          const nx = dx/dist, ny = dy/dist;
          const overlap = (minDist-dist)/2;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;

          const m1 = a.value, m2 = b.value;
          const v1n = a.vx*nx + a.vy*ny;
          const v2n = b.vx*nx + b.vy*ny;
          const v1nAfter = (v1n*(m1-m2) + 2*m2*v2n)/(m1+m2);
          const v2nAfter = (v2n*(m2-m1) + 2*m1*v1n)/(m1+m2);
          a.vx += (v1nAfter-v1n)*nx; a.vy += (v1nAfter-v1n)*ny;
          b.vx += (v2nAfter-v2n)*nx; b.vy += (v2nAfter-v2n)*ny;
        }
      }
    }
  }

  function computeScores(){
    let s=0, a=0;
    for (const o of orbs){
      if (o.team==='player' && o.x > centerX()) s += o.value;
      if (o.team==='ai' && o.x < centerX()) a += o.value;
    }
    return {player:s, ai:a};
  }

  function aiPlay(){
    const mine = orbs.filter(o=>o.team==='ai' && isStationary(o));
    if (!mine.length) { endTurn(); return; }
    const shooter = mine[Math.floor(Math.random()*mine.length)];
    const target = { x: W*0.18 + Math.random()*W*0.18, y: shooter.y + (Math.random()-0.5)*140 };
    const dirx = shooter.x-target.x, diry = shooter.y-target.y;
    const len = Math.hypot(dirx,diry) || 1;
    const dist = 70 + Math.random()*MAX_DRAG*0.6;
    shooter.vx = (dirx/len) * dist * POWER * 6;
    shooter.vy = (diry/len) * dist * POWER * 6;
    busy = true;
  }

  function endTurn(){
    turn = turn === 'player' ? 'ai' : 'player';
    turnEl.textContent = turnLabel();
    if (turn === 'ai' && mode === 'ai'){
      aiTimer = setTimeout(()=>{ if(!gameOver) aiPlay(); }, 650);
    }
  }

  function endGame(){
    gameOver = true;
    clearTimeout(aiTimer); aiTimer = null;
    const s = computeScores();
    let title;
    if (mode === 'pvp'){
      if (s.player > s.ai) title = 'Gana el Jugador 1 (azul)';
      else if (s.ai > s.player) title = 'Gana el Jugador 2 (naranja)';
      else title = 'Empate';
    } else {
      if (s.player > s.ai) title = '¡Ganaste!';
      else if (s.ai > s.player) title = 'Perdiste';
      else title = 'Empate';
    }
    overlayTitle.textContent = title;
    overlaySub.textContent = `${s.player} — ${s.ai}`;
    overlay.classList.remove('hidden');
  }

  function drawBoard(){
    ctx.clearRect(0,0,W,H);
    const cx = centerX();
    // halves
    const gB = ctx.createLinearGradient(0,0,cx,0);
    gB.addColorStop(0,'rgba(51,193,255,0.16)'); gB.addColorStop(1,'rgba(51,193,255,0.04)');
    ctx.fillStyle = gB; ctx.fillRect(0,0,cx,H);
    const gO = ctx.createLinearGradient(cx,0,W,0);
    gO.addColorStop(0,'rgba(255,138,43,0.04)'); gO.addColorStop(1,'rgba(255,138,43,0.16)');
    ctx.fillStyle = gO; ctx.fillRect(cx,0,W-cx,H);

    // diagonal hatch (subtle)
    ctx.save();
    ctx.globalAlpha = 0.05; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    for(let x=-H;x<W;x+=26){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+H,H); ctx.stroke();
    }
    ctx.restore();

    // center line
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.setLineDash([6,8]);
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,H); ctx.stroke();
    ctx.setLineDash([]);

    // border glow
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1,1,W-2,H-2);
  }

  function drawOrb(o){
    const color = o.team==='player' ? {c:'#33c1ff', d:'#083047'} : {c:'#ff8a2b', d:'#4a1f04'};
    ctx.save();
    ctx.shadowColor = color.c; ctx.shadowBlur = 14;
    const g = ctx.createRadialGradient(o.x-o.r*0.35, o.y-o.r*0.35, o.r*0.1, o.x, o.y, o.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, color.c);
    g.addColorStop(1, color.d);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = color.c; ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#04101c';
    ctx.font = `700 ${Math.max(11,o.r*0.85)}px Orbitron, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#04101c';
    ctx.fillText(o.value, o.x, o.y+1);
  }

  function drawDrag(){
    if (!dragOrb || !dragCurrent) return;
    let dx = dragOrb.x - dragCurrent.x, dy = dragOrb.y - dragCurrent.y;
    let dist = Math.min(Math.hypot(dx,dy), MAX_DRAG);
    const ang = Math.atan2(dy,dx);
    const ex = dragOrb.x + Math.cos(ang)*dist;
    const ey = dragOrb.y + Math.sin(ang)*dist;
    ctx.save();
    ctx.setLineDash([6,6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dragOrb.x,dragOrb.y); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.setLineDash([]);
    // arrow head pointing forward (opposite pull)
    const fx = dragOrb.x - (ex-dragOrb.x), fy = dragOrb.y - (ey-dragOrb.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.moveTo(dragOrb.x,dragOrb.y); ctx.lineTo(fx,fy); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx,fy,4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
  }

  function loop(ts){
    if (started && !gameOver){
      if (lastTs === null) lastTs = ts;
      const dt = (ts-lastTs)/1000; lastTs = ts;

      if (busy) {
        physicsStep();
        if (allStationary()){
          busy = false;
          if (!gameOver) endTurn();
        }
      } else if (!dragOrb && !gameOver && !aiTimer){
        // idle, waiting for input (player) - nothing
      }

      if (!dragOrb){
        timeLeft -= dt;
        if (timeLeft <= 0){ timeLeft = 0; endGame(); }
      }
      const mm = Math.floor(timeLeft/60), ss = Math.floor(timeLeft%60);
      timerEl.textContent = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;

      const s = computeScores();
      scoreLeftEl.textContent = s.player;
      scoreRightEl.textContent = s.ai;
    }

    drawBoard();
    for (const o of orbs) drawOrb(o);
    drawDrag();

    requestAnimationFrame(loop);
  }

  restartBtn.addEventListener('click', ()=>{ newGame(); });
  backToMenuBtn.addEventListener('click', backToMenu);
  modeAiBtn.addEventListener('click', ()=>{ mode='ai'; newGame(); });
  modePvpBtn.addEventListener('click', ()=>{ mode='pvp'; newGame(); });
  howto.addEventListener('click', ()=>{
    const msg = mode === 'pvp'
      ? 'MASS BRAWL — Prototipo\n\nArrastra uno de tus orbes hacia atrás y suelta para lanzarlo como un tirachinas.\nCada orbe vale puntos según su número.\nGanas puntos por cada orbe tuyo que quede en el campo contrario cuando el tiempo se acabe.\nUsa los rebotes en las paredes y los choques entre orbes a tu favor.\nTurnos alternos: Jugador 1 (azul) y Jugador 2 (naranja), en el mismo dispositivo.'
      : 'MASS BRAWL — Prototipo\n\nArrastra uno de tus orbes (azules) hacia atrás y suelta para lanzarlo como un tirachinas.\nCada orbe vale puntos según su número.\nGanas puntos por cada orbe tuyo que quede en el campo rival cuando el tiempo se acabe.\nUsa los rebotes en las paredes y los choques entre orbes a tu favor.\nTurnos alternos: tú y la IA.';
    alert(msg);
  });

  // Muestra el tablero (estático) detrás del menú antes de elegir modo
  resize();
  orbs = [
    ...makeTeam('player', [1,2,3,2,3]),
    ...makeTeam('ai', [5,2,1,2,7])
  ];
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
