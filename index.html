<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mass Brawl — Prototipo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rubik:wght@400;500;700&display=swap');

  :root{
    --blue: #33c1ff;
    --blue-dark: #0a3d5c;
    --orange: #ff8a2b;
    --orange-dark: #5c2e0a;
    --bg: #050a14;
    --panel: #0b1220;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg);
    font-family: 'Rubik', sans-serif; color:#eaf2ff;
    overflow:hidden; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    position:relative; width:640px; max-width:100vw; height:100vh; max-height:900px;
    background:
      radial-gradient(circle at 20% 0%, rgba(51,193,255,0.08), transparent 45%),
      radial-gradient(circle at 80% 0%, rgba(255,138,43,0.08), transparent 45%),
      var(--bg);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #hud{ display:none; }
  .playerHud{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .inventory{ display:flex; gap:3px; min-height:18px; color:#9fb3d1; font-size:11px; }
  .miniTimer{
    font-family:'Orbitron', sans-serif; font-weight:600; font-size:11px;
    color:#cfe3ff; background:transparent; padding:4px 10px; border-radius:8px;
    min-width:52px; text-align:center; border:1px solid rgba(255,255,255,0.08);
  }
  .inventory span{ min-width:16px; text-align:center; border-radius:5px; padding:2px 3px; background:transparent; border:1px solid rgba(255,255,255,0.10); }
  .score{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:28px;
    min-width:72px; text-align:center; padding:6px 14px; border-radius:14px;
    background:transparent;
  }
  .score.blue{ color:var(--blue); border:2px solid var(--blue); box-shadow:0 0 14px rgba(51,193,255,0.35) inset; }
  .score.orange{ color:var(--orange); border:2px solid var(--orange); box-shadow:0 0 14px rgba(255,138,43,0.35) inset; }
  #turnIndicator{
    display:none;
  }
  #canvasWrap{ position:relative; flex:1; margin:0 10px 12px; border-radius:18px; overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  #gameHud{
    position:absolute; inset:0; z-index:7;
    display:block; pointer-events:none;
    background:transparent; border:none; box-shadow:none;
  }
  .boardSide{ position:absolute; display:flex; align-items:center; justify-content:center; gap:8px; min-width:140px; border-radius:12px; border:1px solid transparent; transition:box-shadow 260ms ease, border-color 260ms ease, opacity 260ms ease, transform 260ms ease; }
  .boardSide.left{ left:12px; bottom:12px; }
  .boardSide.right{ right:12px; top:12px; transform:rotate(180deg); }
  .boardSide.left.active{ border-color:var(--blue); box-shadow:0 0 14px rgba(51,193,255,0.85), inset 0 0 12px rgba(51,193,255,0.4); }
  .boardSide.right.active{ border-color:var(--orange); box-shadow:0 0 14px rgba(255,138,43,0.85), inset 0 0 12px rgba(255,138,43,0.4); }
  .boardSide:not(.active){ opacity:0.78; }
  .boardHudPlayer{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 6px; border-radius:12px; background:transparent; }
  .boardHudPlayer .inventory{ min-height:20px; }
  .boardHudPlayer .inventory span{ background:transparent; border:1px solid rgba(255,255,255,0.08); }
  .boardHudPlayer .miniTimer{ min-width:60px; }
  .boardHudPlayer .score{ font-size:24px; min-width:70px; padding:6px 12px; background:transparent; }
  #overlay{
    position:absolute; inset:0; background:rgba(3,6,12,0.86);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    text-align:center; padding:20px; z-index:5;
  }
  #overlay.hidden{ display:none; }
  #overlayTitle{ font-family:'Orbitron', sans-serif; font-size:30px; margin:0; }
  #overlaySub{ color:#9fb3d1; margin:0; font-size:14px; max-width:280px; }
  #helpPanel{
    position:absolute;
    right:12px; top:46px; bottom:46px;
    z-index:11;
    width:34px;
    min-width:34px;
    max-width:34px;
    background:rgba(11,17,32,0.84);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:10px;
    padding:12px 0;
    color:#eaf2ff;
    box-shadow:0 10px 26px rgba(0,0,0,0.7);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform:rotate(180deg);
    display:none;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  #helpPanel.visible{ display:flex; }
  #helpPanel h2{ display:none; }
  #helpPanel p{ margin:0; color:#eaf2ff; font-size:11px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transform:rotate(180deg); }
  button{
    font-family:'Rubik', sans-serif; font-weight:700; font-size:15px;
    padding:12px 26px; border-radius:24px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--blue), var(--orange)); color:#04101c;
  }
  #howto{
    position:absolute; right:12px; top:50%; width:34px; height:34px; border-radius:50%;
    background:var(--panel); color:#cfe3ff; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer; z-index:6; border:1px solid rgba(255,255,255,0.15);
    transform:translateY(-50%) rotate(90deg);
  }
  #menuOverlay{
    position:absolute; inset:0; background:
      radial-gradient(circle at 25% 20%, rgba(51,193,255,0.16), transparent 50%),
      radial-gradient(circle at 75% 80%, rgba(255,138,43,0.16), transparent 50%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:26px;
    text-align:center; padding:30px; z-index:10;
  }
  #menuOverlay.hidden{ display:none; }
  #menuTitle{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size:38px; margin:0;
    letter-spacing:1px;
  }
  #menuTitle span{ color:var(--orange); }
  #menuSub{ color:#9fb3d1; margin:-14px 0 6px; font-size:14px; max-width:280px; }
  .modeBtn{
    width:240px; padding:16px 20px; border-radius:16px; border:2px solid rgba(255,255,255,0.12);
    background:var(--panel); color:#eaf2ff; font-family:'Rubik',sans-serif; cursor:pointer;
    display:flex; flex-direction:column; gap:4px; align-items:center;
  }
  .modeBtn strong{ font-size:16px; }
  .modeBtn small{ color:#9fb3d1; font-weight:400; }
  .modeBtn.blueMode{ border-color:var(--blue); }
  .modeBtn.orangeMode{ border-color:var(--orange); }
  .modeBtn:active{ transform:scale(0.97); }
  #backToMenuBtn{
    margin-top:4px; background:transparent; color:#9fb3d1; text-decoration:underline;
    font-weight:500; padding:6px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="howto" title="Cómo jugar">?</div>
  <div id="canvasWrap">
    <div id="gameHud">
      <div id="leftBoardSide" class="boardSide left">
        <div class="boardHudPlayer">
          <div id="scoreLeft" class="score blue">0</div>
          <div id="inventoryBlue" class="inventory"></div>
          <div id="timerLeft" class="miniTimer">01:00</div>
        </div>
      </div>
      <div id="rightBoardSide" class="boardSide right">
        <div class="boardHudPlayer">
          <div id="scoreRight" class="score orange">0</div>
          <div id="inventoryOrange" class="inventory"></div>
          <div id="timerRight" class="miniTimer">01:00</div>
        </div>
      </div>
    </div>
    <div id="turnIndicator">Tu turno — arrastra un orbe azul</div>
    <canvas id="game"></canvas>
    <div id="menuOverlay">
      <h1 id="menuTitle">MASS <span>BRAWL</span></h1>
      <p id="menuSub">Elige contra quién quieres jugar</p>
      <button class="modeBtn blueMode" id="modeAiBtn">
        <strong>Jugar contra la IA</strong>
        <small>Tú (azul) vs. la máquina (naranja)</small>
      </button>
      <button class="modeBtn orangeMode" id="modePvpBtn">
        <strong>Jugar contra otra persona</strong>
        <small>Mismo dispositivo, turnos alternos</small>
      </button>
    </div>
    <div id="helpPanel">
      <h2>MASS BRAWL</h2>
      <p id="helpText">Tú mandas el azul. Arrastra un orbe hacia atrás y suéltalo.</p>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="overlayTitle">¡Victoria!</h1>
      <p id="overlaySub"></p>
      <button id="restartBtn">Jugar de nuevo</button>
      <button id="backToMenuBtn">Volver al menú</button>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');
  const scoreLeftEl = document.getElementById('scoreLeft');
  const scoreRightEl = document.getElementById('scoreRight');
  const inventoryBlueEl = document.getElementById('inventoryBlue');
  const inventoryOrangeEl = document.getElementById('inventoryOrange');
  const timerLeftEl = document.getElementById('timerLeft');
  const timerRightEl = document.getElementById('timerRight');
  const leftBoardSide = document.getElementById('leftBoardSide');
  const rightBoardSide = document.getElementById('rightBoardSide');
  const turnEl = document.getElementById('turnIndicator');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const restartBtn = document.getElementById('restartBtn');
  const backToMenuBtn = document.getElementById('backToMenuBtn');
  const howto = document.getElementById('howto');
  const helpPanel = document.getElementById('helpPanel');
  const helpText = document.getElementById('helpText');
  const menuOverlay = document.getElementById('menuOverlay');
  const modeAiBtn = document.getElementById('modeAiBtn');
  const modePvpBtn = document.getElementById('modePvpBtn');

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  const FRICTION = 0.985;
  const MIN_SPEED = 0.04;
  const WALL_BOUNCE = 0.65;
  const MAX_DRAG = 140;
  const POWER = 0.045;
  const MAX_MASS = 5;
  const INVENTORY_SIZE = 5;
  const TURN_SECONDS = 60;
  const BOMB_PROBABILITY = 0.75;
  const BOMB_RADIUS_BASE = 34;
  const BOMB_RADIUS_PER_MASS = 6;
  const FINAL_VISUAL_DELAY_SECONDS = 2;

  let orbs = [];
  let dragOrb = null, dragStart = null, dragCurrent = null;
  let turn = 'player'; // 'player' | 'ai'  (in pvp mode, 'ai' just means "player 2 / orange")
  let busy = false; // orbs moving, no input allowed
  let playerTimeLeft = TURN_SECONDS;
  let aiTimeLeft = TURN_SECONDS;
  let lastTs = null;
  let gameOver = false;
  let started = false;
  let mode = 'ai'; // 'ai' | 'pvp'
  let aiTimer = null;
  let finalDelayTimer = null;
  let explosions = [];

  function centerX(){ return W/2; }
  function bandHeight(){ return H/4; }
  function launchY(team){ return team === 'player' ? H-bandHeight()/2 : bandHeight()/2; }
  function scoringBand(team){ return team === 'player' ? 1 : 2; }
  function pickupTeam(y){
    if (y < bandHeight()) return 'ai';
    if (y > H-bandHeight()) return 'player';
    return null;
  }

  let inventory = { player: [], ai: [] };
  let nextOrbId = 0;

  function renderInventory(){
    inventoryBlueEl.innerHTML = inventory.player.map(item => `<span>${item.bomb ? '✹' + item.value : item.value}</span>`).join('');
    inventoryOrangeEl.innerHTML = inventory.ai.map(item => `<span>${item.bomb ? '✹' + item.value : item.value}</span>`).join('');
  }

  function randomInventory(){
    return Array.from({length: INVENTORY_SIZE}, () => {
      const value = 1 + Math.floor(Math.random() * MAX_MASS);
      return { value, bomb: Math.random() < BOMB_PROBABILITY };
    });
  }

  function createInventoryOrb(team, item, point){
    const value = item.value ?? item;
    const bomb = item.bomb ?? false;
    const r = 14 + value*1.6;
    return {
      id: `orb${nextOrbId++}`, team, value, bomb, r,
      bombRadius: bomb ? BOMB_RADIUS_BASE + value * BOMB_RADIUS_PER_MASS : 0,
      x: point ? point.x : W/2, y: point ? point.y : launchY(team), vx: 0, vy: 0
    };
  }

  function startInventoryDrag(team, point){
    if (team !== turn || !inventory[team].length) return false;
    const item = inventory[team].pop();
    dragOrb = createInventoryOrb(team, item, point);
    dragStart = point; dragCurrent = point;
    renderInventory();
    return true;
  }

  function turnLabel(){
    if (turn === 'player') {
      return mode === 'pvp'
        ? 'Jugador 1 (azul): arrastra un orbe y suelta'
        : 'Tu turno: arrastra un orbe azul hacia atrás y suelta';
    }
    return mode === 'pvp'
      ? 'Jugador 2 (naranja): arrastra un orbe y suelta'
      : 'Turno rival…';
  }

  function buildHelpText(){
    if (mode === 'pvp') {
      return turn === 'player'
        ? 'Jugador 1 (azul): lanza hacia el campo rival.'
        : 'Jugador 2 (naranja): lanza desde tu lado del tablero.';
    }
    return turn === 'player'
      ? 'Tú mandas el azul: arrastra un orbe hacia atrás y suéltalo.'
      : 'La IA juega el naranja: observa el campo.';
  }

  function newGame(){
    resize();
    orbs = [];
    inventory = { player: randomInventory(), ai: randomInventory() };
    renderInventory();
    turn = 'player';
    busy = false;
    playerTimeLeft = TURN_SECONDS;
    aiTimeLeft = TURN_SECONDS;
    gameOver = false;
    started = true;
    clearTimeout(aiTimer); aiTimer = null;
    clearTimeout(finalDelayTimer); finalDelayTimer = null;
    overlay.classList.add('hidden');
    menuOverlay.classList.add('hidden');
    turnEl.textContent = turnLabel();
    helpText.textContent = buildHelpText();
    updateTurnUI();
    updateTimerDisplay();
    lastTs = null;
    requestAnimationFrame(loop);
  }

  function backToMenu(){
    clearTimeout(aiTimer); aiTimer = null;
    clearTimeout(finalDelayTimer); finalDelayTimer = null;
    started = false;
    gameOver = false;
    overlay.classList.add('hidden');
    menuOverlay.classList.remove('hidden');
  }

  function orbAt(px, py){
    for(let i=orbs.length-1;i>=0;i--){
      const o = orbs[i];
      const dx = px-o.x, dy = py-o.y;
      if (Math.hypot(dx,dy) <= o.r+6) return o;
    }
    return null;
  }

  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX-rect.left, y: t.clientY-rect.top };
  }

  function onDown(e){
    if (busy || gameOver || !started || !canPlay(turn)) return;
    const p = pointerPos(e);

    // Solo se lanzan orbes nuevos desde la zona de lanzamiento del equipo activo.
    // Los orbes ya presentes en el tablero quedan inmóviles y no se pueden arrastrar.
    if ((turn === 'player' && p.y > H-bandHeight()) || (turn === 'ai' && p.y < bandHeight())) {
      if (startInventoryDrag(turn, p)) e.preventDefault();
    }
  }
  function onMove(e){
    if (!dragOrb) return;
    dragCurrent = pointerPos(e);
    e.preventDefault();
  }
  function onUp(e){
    if (!dragOrb) return;
    const p = dragCurrent || dragStart;
    let dx = dragOrb.x - p.x, dy = dragOrb.y - p.y; // pull-back direction = launch direction
    let dist = Math.hypot(dx,dy);
    dist = Math.min(dist, MAX_DRAG);
    if (dist > 8) {
      const dirx = dx/Math.hypot(dx,dy || 1e-6), diry = dy/Math.hypot(dx,dy || 1e-6);
      const massFactor = 1 / Math.sqrt(dragOrb.value);
      dragOrb.vx = dirx * dist * POWER * 6 * massFactor;
      dragOrb.vy = diry * dist * POWER * 6 * massFactor;
      busy = true;
      turnEl.textContent = mode === 'pvp'
        ? (turn === 'player' ? 'Orbe del Jugador 1 en juego…' : 'Orbe del Jugador 2 en juego…')
        : (turn === 'player' ? 'Orbe en juego…' : 'La IA está jugando…');
      orbs.push(dragOrb);
    } else if (!orbs.includes(dragOrb)) {
      inventory[dragOrb.team].push({ value: dragOrb.value, bomb: dragOrb.bomb });
      renderInventory();
    }
    dragOrb = null; dragStart = null; dragCurrent = null;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);

  function isStationary(o){
    return Math.hypot(o.vx,o.vy) < MIN_SPEED;
  }
  function allStationary(){
    return orbs.every(isStationary);
  }

  function detonateBombs(){
    const stationaryBombs = orbs.filter(o => o.bomb && isStationary(o));
    const contactBombs = orbs.filter(o => o.bomb && orbs.some(x => x !== o && x.team !== o.team && Math.hypot(x.x-o.x, x.y-o.y) <= o.bombRadius));
    const bombSources = new Map();

    for (const bomb of stationaryBombs) bombSources.set(bomb.id, bomb);
    for (const bomb of contactBombs) bombSources.set(bomb.id, bomb);

    if (!bombSources.size) return;

    const blastMarks = [];

    for (const bomb of bombSources.values()) {
      const victims = orbs.filter(o => o !== bomb && o.team !== bomb.team && Math.hypot(o.x-bomb.x, o.y-bomb.y) <= bomb.bombRadius);

      for (const victim of victims) {
        victim.value -= bomb.value;

        if (victim.value <= 0) {
          victim.dead = true;
        }
      }

      bomb.dead = true;
      blastMarks.push({ x: bomb.x, y: bomb.y, radius: bomb.bombRadius, age: 0, maxAge: 0.45 });
    }

    const remaining = [];
    for (const o of orbs) {
      if (o.dead) {
        continue;
      }
      remaining.push(o);
    }

    orbs = remaining;

    if (blastMarks.length) {
      explosions.push(...blastMarks);
      renderInventory();
    }
  }

  function physicsStep(){
    for (const o of orbs){
      o.x += o.vx; o.y += o.vy;
      o.vx *= FRICTION; o.vy *= FRICTION;
      if (Math.hypot(o.vx,o.vy) < MIN_SPEED) { o.vx = 0; o.vy = 0; }

      if (o.x - o.r < 0) { o.x = o.r; o.vx = Math.abs(o.vx)*WALL_BOUNCE; }
      if (o.x + o.r > W) { o.x = W-o.r; o.vx = -Math.abs(o.vx)*WALL_BOUNCE; }
      if (o.y - o.r < 0) { o.y = o.r; o.vy = Math.abs(o.vy)*WALL_BOUNCE; }
      if (o.y + o.r > H) { o.y = H-o.r; o.vy = -Math.abs(o.vy)*WALL_BOUNCE; }
    }
    // collisions
    for (let i=0;i<orbs.length;i++){
      for (let j=i+1;j<orbs.length;j++){
        const a = orbs[i], b = orbs[j];
        const dx = b.x-a.x, dy = b.y-a.y;
        const dist = Math.hypot(dx,dy) || 0.0001;
        const minDist = a.r+b.r;
        if (dist < minDist){
          const nx = dx/dist, ny = dy/dist;
          const overlap = (minDist-dist)/2;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;

          const m1 = a.value, m2 = b.value;
          const v1n = a.vx*nx + a.vy*ny;
          const v2n = b.vx*nx + b.vy*ny;
          const v1nAfter = (v1n*(m1-m2) + 2*m2*v2n)/(m1+m2);
          const v2nAfter = (v2n*(m2-m1) + 2*m1*v1n)/(m1+m2);
          a.vx += (v1nAfter-v1n)*nx; a.vy += (v1nAfter-v1n)*ny;
          b.vx += (v2nAfter-v2n)*nx; b.vy += (v2nAfter-v2n)*ny;
        }
      }
    }
    for (let i=orbs.length-1;i>=0;i--){
      const o = orbs[i];
      const collector = pickupTeam(o.y);
      if (collector && isStationary(o)) {
        inventory[collector].push({ value: o.value, bomb: o.bomb });
        orbs.splice(i, 1);
        renderInventory();
      }
    }
  }

  function computeScores(){
    let s=0, a=0;
    for (const o of orbs){
      if (o.team === 'player' && Math.floor(o.y / bandHeight()) === scoringBand('player')) s += o.value;
      if (o.team === 'ai' && Math.floor(o.y / bandHeight()) === scoringBand('ai')) a += o.value;
    }
    return {player:s, ai:a};
  }

  function aiPlay(){
    aiTimer = null;
    if (!inventory.ai.length) { endTurn(); return; }
    const item = inventory.ai.pop();
    const shooter = createInventoryOrb('ai', item);
    const target = { x: W/2 + (Math.random()-0.5)*W*0.5, y: H*0.7 };
    const dirx = shooter.x-target.x, diry = shooter.y-target.y;
    const len = Math.hypot(dirx,diry) || 1;
    const dist = 70 + Math.random()*MAX_DRAG*0.6;
    const massFactor = 1 / Math.sqrt(shooter.value);
    shooter.vx = (dirx/len) * dist * POWER * 6 * massFactor;
    shooter.vy = (diry/len) * dist * POWER * 6 * massFactor;
    orbs.push(shooter);
    renderInventory();
    busy = true;
  }

  function hasAvailableOrb(team){
    return inventory[team].length > 0;
  }

  function otherTeam(team){
    return team === 'player' ? 'ai' : 'player';
  }

  function formatTime(seconds){
    const safe = Math.max(0, Math.ceil(seconds));
    const mm = Math.floor(safe / 60);
    const ss = safe % 60;
    return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  }

  function updateTurnUI(){
    leftBoardSide.classList.toggle('active', turn === 'player');
    rightBoardSide.classList.toggle('active', turn === 'ai');
  }

  function updateTimerDisplay(){
    timerLeftEl.textContent = formatTime(playerTimeLeft);
    timerRightEl.textContent = formatTime(aiTimeLeft);
  }

  function hasOrbsForTeam(team){
    return inventory[team].length > 0;
  }

  function canPlay(team){
    if (team === 'player') return playerTimeLeft > 0 && hasOrbsForTeam('player');
    return aiTimeLeft > 0 && hasOrbsForTeam('ai');
  }

  function checkGameEnd(){
    if (busy || dragOrb || !allStationary()) {
      return false;
    }

    if (orbs.some(o => o.bomb)) {
      detonateBombs();
      return false;
    }

    const playerNoOrbs = !hasOrbsForTeam('player');
    const aiNoOrbs = !hasOrbsForTeam('ai');
    const playerNoTime = playerTimeLeft <= 0;
    const aiNoTime = aiTimeLeft <= 0;

    const shouldEnd =
      (playerNoOrbs && aiNoOrbs) ||
      (playerNoOrbs && aiNoTime) ||
      (aiNoOrbs && playerNoTime) ||
      (playerNoTime && aiNoTime) ||
      (!canPlay('player') && !canPlay('ai'));

    if (!shouldEnd) {
      return false;
    }

    if (!finalDelayTimer) {
      finalDelayTimer = setTimeout(() => {
        finalDelayTimer = null;
        endGame();
      }, FINAL_VISUAL_DELAY_SECONDS * 1000);
    }

    return true;
  }

  function endTurn(){
    clearTimeout(aiTimer);
    aiTimer = null;

    const current = turn;
    const rival = otherTeam(current);

    if (!canPlay(current) && canPlay(rival)) {
      turn = rival;
    } else if (!canPlay(current) && !canPlay(rival)) {
      checkGameEnd();
      return;
    } else if (canPlay(rival)) {
      turn = rival;
    } else if (canPlay(current)) {
      // Se mantiene el turno del jugador actual si el rival no puede jugar.
    } else {
      checkGameEnd();
      return;
    }

    turnEl.textContent = turnLabel();
    helpText.textContent = buildHelpText();
    updateTurnUI();
    updateTimerDisplay();

    if (turn === 'ai' && mode === 'ai'){
      aiTimer = setTimeout(()=>{ if(!gameOver) aiPlay(); }, 650);
    }
  }

  function endGame(){
    gameOver = true;
    clearTimeout(aiTimer); aiTimer = null;
    const s = computeScores();
    let title;

    if (mode === 'pvp') {
      if (s.player > s.ai) title = 'Gana el Jugador 1 (azul)';
      else if (s.ai > s.player) title = 'Gana el Jugador 2 (naranja)';
      else title = 'Empate';
    } else {
      if (s.player > s.ai) title = '¡Ganaste!';
      else if (s.ai > s.player) title = 'Perdiste';
      else title = 'Empate';
    }

    overlayTitle.textContent = title;
    overlaySub.textContent = `${s.player} — ${s.ai}`;
    overlay.classList.remove('hidden');
  }

  function drawBoard(){
    ctx.clearRect(0,0,W,H);
    const bands = ['rgba(255,255,255,0.15)', 'rgba(51,193,255,0.18)', 'rgba(255,138,43,0.18)', 'rgba(255,255,255,0.15)'];
    bands.forEach((color, index) => {
      ctx.fillStyle = color;
      ctx.fillRect(0, index*bandHeight(), W, bandHeight());
    });

    // diagonal hatch (subtle)
    ctx.save();
    ctx.globalAlpha = 0.05; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    for(let x=-H;x<W;x+=26){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+H,H); ctx.stroke();
    }
    ctx.restore();

    // Separadores de las cuatro bandas
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.setLineDash([6,8]);
    for (let index=1; index<4; index++) {
      ctx.beginPath(); ctx.moveTo(0,index*bandHeight()); ctx.lineTo(W,index*bandHeight()); ctx.stroke();
    }
    ctx.setLineDash([]);

    // border glow
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1,1,W-2,H-2);
  }

  function drawOrb(o){
    const color = o.team==='player' ? {c:'#33c1ff', d:'#083047'} : {c:'#ff8a2b', d:'#4a1f04'};
    const isScoring = o === dragOrb || Math.floor(o.y / bandHeight()) === scoringBand(o.team);
    ctx.save();
    ctx.globalAlpha = isScoring ? 1 : 0.24;
    ctx.shadowColor = color.c; ctx.shadowBlur = 14;
    const g = ctx.createRadialGradient(o.x-o.r*0.35, o.y-o.r*0.35, o.r*0.1, o.x, o.y, o.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, color.c);
    g.addColorStop(1, color.d);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = color.c; ctx.stroke();

    if (o.bomb) {
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r+4,0,Math.PI*2); ctx.strokeStyle = 'rgba(255,255,180,0.95)'; ctx.lineWidth = 2; ctx.stroke();
    }

    ctx.restore();

    ctx.save();
    ctx.globalAlpha = isScoring ? 1 : 0.24;
    ctx.fillStyle = '#04101c';
    ctx.font = `700 ${Math.max(11,o.r*0.85)}px Orbitron, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.value, o.x, o.y+1);
    ctx.restore();
  }

  function updateExplosions(dt){
    if (!explosions.length) return;
    explosions = explosions
      .map(e => ({...e, age: e.age + dt}))
      .filter(e => e.age < e.maxAge);
  }

  function drawExplosions(){
    for (const e of explosions) {
      const life = e.age / e.maxAge;
      const radius = e.radius * (0.2 + life);
      ctx.save();
      ctx.strokeStyle = `rgba(255, 210, 120, ${1-life})`;
      ctx.fillStyle = `rgba(255, 140, 30, ${0.35*(1-life)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, radius, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(e.x, e.y, radius*0.84, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawDrag(){
    if (!dragOrb || !dragCurrent) return;
    let dx = dragOrb.x - dragCurrent.x, dy = dragOrb.y - dragCurrent.y;
    let dist = Math.min(Math.hypot(dx,dy), MAX_DRAG);
    const ang = Math.atan2(dy,dx);
    const ex = dragOrb.x + Math.cos(ang)*dist;
    const ey = dragOrb.y + Math.sin(ang)*dist;
    ctx.save();
    ctx.setLineDash([6,6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dragOrb.x,dragOrb.y); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.setLineDash([]);
    // arrow head pointing forward (opposite pull)
    const fx = dragOrb.x - (ex-dragOrb.x), fy = dragOrb.y - (ey-dragOrb.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.moveTo(dragOrb.x,dragOrb.y); ctx.lineTo(fx,fy); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx,fy,4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
  }

  function loop(ts){
    if (started && !gameOver){
      if (lastTs === null) lastTs = ts;
      const dt = (ts-lastTs)/1000; lastTs = ts;

      if (busy) {
        physicsStep();
        detonateBombs();
        if (allStationary()){
          detonateBombs();
          busy = false;
          if (!gameOver) endTurn();
        }
      } else if (!dragOrb && !canPlay(turn)) {
        endTurn();
      } else if (!dragOrb && !gameOver && !aiTimer){
        // idle, waiting for input (player) - nothing
      }

      if (!gameOver) {
        updateExplosions(dt);
        if (turn === 'player') {
          playerTimeLeft = Math.max(0, playerTimeLeft - dt);
          if (playerTimeLeft === 0) {
            if (canPlay('ai')) {
              turn = 'ai';
              turnEl.textContent = turnLabel();
              helpText.textContent = buildHelpText();
              updateTurnUI();
            }
          }
        } else {
          aiTimeLeft = Math.max(0, aiTimeLeft - dt);
          if (aiTimeLeft === 0) {
            if (canPlay('player')) {
              turn = 'player';
              turnEl.textContent = turnLabel();
              helpText.textContent = buildHelpText();
              updateTurnUI();
            }
          }
        }
      }

      if (!gameOver) {
        updateTimerDisplay();
        checkGameEnd();
      }

      const s = computeScores();
      scoreLeftEl.textContent = s.player;
      scoreRightEl.textContent = s.ai;
    }

    drawBoard();
    for (const o of orbs) drawOrb(o);
    if (dragOrb && !orbs.includes(dragOrb)) drawOrb(dragOrb);
    drawExplosions();
    drawDrag();

    requestAnimationFrame(loop);
  }

  restartBtn.addEventListener('click', ()=>{ newGame(); });
  backToMenuBtn.addEventListener('click', backToMenu);
  modeAiBtn.addEventListener('click', ()=>{ mode='ai'; newGame(); });
  modePvpBtn.addEventListener('click', ()=>{ mode='pvp'; newGame(); });
  howto.addEventListener('click', ()=>{
    helpText.textContent = buildHelpText();
    const isVisible = helpPanel.classList.toggle('visible');
    howto.style.display = isVisible ? 'none' : 'flex';
  });

  helpPanel.addEventListener('click', ()=>{
    helpPanel.classList.remove('visible');
    howto.style.display = 'flex';
  });

  // Muestra el tablero vacío detrás del menú antes de elegir modo
  resize();
  orbs = [];
  inventory = { player: [], ai: [] };
  renderInventory();
  requestAnimationFrame(loop);
})();
</script>
</body>
